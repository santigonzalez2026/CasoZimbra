# =====================================================================================
# CONFIGURACIÓN DE CONEXIÓN A LA BASE DE DATOS MYSQL - CASO ZIMBRA (SESIÓN 2)
# Curso: Sistemas Transaccionales de Bases de Datos - UNIMINUTO
# =====================================================================================

spring.application.name=backend-zimbra-transaccional
server.port=8080

# Parámetros de conexión JDBC a MySQL 8.0+ / MariaDB
spring.datasource.url=jdbc:mysql://localhost:3306/zimbra_transaccional?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración del pool de conexiones HikariCP para control transaccional
spring.datasource.hikari.pool-name=ZimbraHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.auto-commit=true

# Nivel de registro para visualizar transacciones SQL y commits/rollbacks en consola
logging.level.org.springframework.jdbc.datasource.DataSourceTransactionManager=DEBUG
logging.level.com.uniminuto.zimbra=INFO
